name: Deploy to Vercel

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        timeout-minutes: 10
        run: |
          unset GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_WORKFLOW \
                GITHUB_RUN_ID GITHUB_ACTOR GITHUB_EVENT_NAME GITHUB_HEAD_REF \
                GITHUB_BASE_REF GITHUB_SERVER_URL GITHUB_API_URL GITHUB_GRAPHQL_URL
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
